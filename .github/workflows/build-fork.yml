name: Build fork APK
on:
  push:
    branches: [ master, viper-extras ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt
      - name: Build rootless debug APK (FOSS, no crashlytics)
        run: ./gradlew assembleRootlessFdroidDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootlessJamesDSP-viper-extras
          path: app/build/outputs/apk/rootlessFdroid/debug/*.apk
