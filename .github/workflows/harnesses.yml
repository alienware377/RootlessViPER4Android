name: Native harnesses

# Builds every tools/*_harness with the host clang and runs it, the same way
# tools/run_harnesses.sh does on a desk. Only on changes that can move a
# result, since a full run takes a few minutes.
on:
  push:
    branches: [ viper-extras ]
    paths:
      - 'app/src/main/cpp/**'
      - 'third_party/**'
      - 'tools/**'
      - '.github/workflows/harnesses.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clang with its AddressSanitizer runtime (the SOFA reader runs under it)
      # and zlib for libmysofa.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev zlib1g-dev

      # defaults: the classic ViPER reverb measures -21 dB at its shipping
      # settings against a -20 dB line. Whether to raise its default is a
      # listening decision; until then it is reported, not a red build.
      - name: Build and run
        env:
          KNOWN_FAIL: defaults
          TIMEOUT: 300
        run: tools/run_harnesses.sh

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs
          path: tools/host_build/*.log

  # The same harnesses under AddressSanitizer and UBSan: a pass also needs a
  # clean sanitizer report. Three checks time the code (share of a core, how
  # long the audio thread waits on a lock) and cannot pass at sanitizer speed,
  # so they are known failures here only; the job above holds them to account.
  sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev zlib1g-dev

      - name: Build and run under the sanitizers
        env:
          SANITIZE: 1
          KNOWN_FAIL: defaults binaural shaper signalsmith
          TIMEOUT: 900
        run: tools/run_harnesses.sh

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs-sanitized
          path: tools/host_build_san/*.log
