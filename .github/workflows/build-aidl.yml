name: Build AIDL effect service

# Separate from the app workflow: this builds a standalone HAL binary, needs a
# different toolchain setup, and should not slow down or break APK builds while
# it is still being brought up.
on:
  push:
    branches: [ viper-extras ]
    paths:
      - 'magisk/aidl/**'
      - '.github/workflows/build-aidl.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # build-tools 34 must not be used: it does not recognise a suppression
      # annotation in AudioChannelLayout.aidl, reports it as an error, and
      # silently emits only part of the package.
      - name: Install build-tools 37
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" >/dev/null
          ls "$ANDROID_SDK_ROOT/build-tools/"

      - name: Generate AIDL NDK backend
        run: |
          bash magisk/aidl/generate.sh
          find magisk/aidl/generated -type f | wc -l

      # Only 64-bit: the AIDL effect HAL exists on Android 14 and later, and
      # every device that ships it is 64-bit, so a 32-bit build would be dead
      # weight in the package.
      - name: Build all ABIs
        run: |
          for abi in arm64-v8a x86_64; do
            cmake -S magisk/aidl -B "build/$abi" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-33
            cmake --build "build/$abi"
          done

      # The binary is ~30MB unstripped, almost all debug info. Stripping takes
      # it to a size worth shipping in a module.
      - name: Strip and stage
        run: |
          STRIP="$(find "$ANDROID_NDK_LATEST_HOME" -name 'llvm-strip' | head -1)"
          OUT=build/module
          mkdir -p "$OUT/libs/arm64-v8a" "$OUT/libs/x86_64"
          for abi in arm64-v8a x86_64; do
            "$STRIP" "build/$abi/rv4a-effect-service" -o "$OUT/libs/$abi/rv4a-effect-service"
            ls -la "$OUT/libs/$abi/rv4a-effect-service"
          done
          cp magisk/aidl/module/module.prop magisk/aidl/module/customize.sh \
             magisk/aidl/module/post-fs-data.sh magisk/aidl/module/service.sh \
             magisk/aidl/module/rv4a-effect.rc "$OUT/"
          cp magisk/aidl/DESIGN.md "$OUT/README.md"

      - name: Package module
        run: cd build/module && zip -qr ../rv4a-effect-aidl.zip . && unzip -l ../rv4a-effect-aidl.zip

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: RootlessViPER4Android-aidl-module
          path: build/rv4a-effect-aidl.zip
