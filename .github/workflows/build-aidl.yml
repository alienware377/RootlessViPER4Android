name: Build AIDL effect plugin

# Separate from the app workflow: this builds the rooted engine as an AIDL
# effect plugin (librv4a_aidl_v<N>.so) for devices whose audio effects run
# behind the AIDL effect HAL, and the experimental module that installs it.
# It shares the engine with the app, so engine changes trigger it too: the
# plugin compiles hal/JamesDspHalEffect.cpp and every engine source.
on:
  push:
    branches: [ viper-extras, issue-12-aidl ]
    paths:
      - 'magisk/aidl/**'
      - 'app/src/main/cpp/**'
      - 'tools/aidl_plugin_harness.cpp'
      - '.github/workflows/build-aidl.yml'
  pull_request:
    paths:
      - 'magisk/aidl/**'
      - 'app/src/main/cpp/**'
      - '.github/workflows/build-aidl.yml'
      # The service compiles the engine and the hal dispatch too, so a change
      # there can break it as easily as one here.
      - 'app/src/main/cpp/libjamesdsp/**'
      - 'app/src/main/cpp/hal/**'
      - 'third_party/signalsmith-*/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # build-tools 34 must not be used: it does not recognise a suppression
      # annotation in AudioChannelLayout.aidl, reports it as an error, and
      # silently emits only part of the package.
      - name: Install build-tools 37
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" >/dev/null
          ls "$ANDROID_SDK_ROOT/build-tools/"

      # Every effect HAL version (2, 3, 4) for arm64 and x86_64. build.sh
      # generates each version's interface code from its frozen snapshots,
      # links strictly, strips, and runs check-elf.sh on every library:
      # exactly three exports, only LLNDK dependencies, 16 KB alignment, no
      # text relocations, nothing newer than Android 14 from libbinder_ndk.
      - name: Build and check every version and ABI
        run: bash magisk/aidl/build.sh -o build/aidl

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: rv4a-aidl-plugin-libs
          path: build/aidl/libs

      # The installer and boot scripts against sample device trees: VINTF
      # manifests, Qualcomm sku folders, CRLF configs, Pixel's APEX-only
      # layout, conflicting modules, system updates, the two-strike watchdog
      # and crash loop detection. Run with dash, then with busybox's own sh,
      # awk, sed and grep, which is what Magisk and KernelSU run them with.
      - name: Test the module scripts
        run: |
          sudo apt-get install -y busybox
          SH=dash bash magisk/aidl/tests/test_module.sh
          mkdir -p "$RUNNER_TEMP/bb"
          for a in sh awk sed grep cmp head tail cut tr sort wc cat cp mv rm mkdir ln date \
                   sha1sum md5sum readlink basename dirname touch printf; do
            ln -sf "$(command -v busybox)" "$RUNNER_TEMP/bb/$a"
          done
          PATH="$RUNNER_TEMP/bb:$PATH" SH="busybox sh" bash magisk/aidl/tests/test_module.sh

      # Experimental and separate on purpose: it never goes into the normal
      # rv4a_engine release module.
      - name: Package the experimental module
        run: bash magisk/aidl/package.sh build/aidl/libs build/rv4a-engine-aidl-experimental.zip

      - name: Upload the experimental module
        uses: actions/upload-artifact@v4
        with:
          name: rv4a-engine-aidl-EXPERIMENTAL
          path: build/rv4a-engine-aidl-experimental.zip
