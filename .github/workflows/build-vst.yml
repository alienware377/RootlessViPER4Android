name: Build VST3 plugin

on:
  push:
    branches: [ viper-extras ]
    paths: [ 'vst/**', '.github/workflows/build-vst.yml' ]
  workflow_dispatch:

jobs:
  windows:
    # FL Studio needs a Windows binary, and cross-compiling the VST3 SDK is more
    # trouble than simply building where it will run.
    #
    # Both architectures: FL Studio 20 ships as 32-bit and 64-bit, and a 32-bit
    # host cannot load a 64-bit plugin - it may crash scanning it rather than
    # skip it cleanly, which reads as a broken plugin.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (${{ matrix.arch }})
        run: cmake -S vst -B build/vst -A ${{ matrix.cmake_arch }}

      - name: Build
        run: cmake --build build/vst --config Release

      - name: Show what was produced
        run: Get-ChildItem -Recurse build/vst -Include *.vst3 | Select-Object FullName, Length
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: RV4A-VST3-Windows-${{ matrix.arch }}
          path: build/vst/VST3/Release/*.vst3
